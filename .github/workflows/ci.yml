name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Each job declares timeout-minutes so a hung step fails fast
# instead of inheriting the 360-minute GitHub default.
jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: '20'
            astro-version: '5.9.0'
          - node-version: '20'
            astro-version: '5'
          - node-version: '22'
            astro-version: '6'
          - node-version: '22'
            astro-version: '7'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the matrix Astro version
        run: npm install --no-save astro@${{ matrix.astro-version }}

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
